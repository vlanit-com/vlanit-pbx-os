# Генерация SSH host keys ПЕРЕД стартом sshd: ключи удалены из Golden Image
# (уникальность на устройстве). Пустое ExecStartPre= сбрасывает список
# штатных шагов юнита (первый из них — sshd -t, который падает без ключей,
# issue #17), затем ключи генерируются до конфиг-проверки.
# Первичная генерация — при установке (deploy.sh), drop-in — подстраховка.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
