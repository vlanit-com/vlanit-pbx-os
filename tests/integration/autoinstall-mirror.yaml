# Профиль автоматической установки на ЗЕРКАЛО двух дисков (QEMU, сценарий mirror).
# НЕ использовать на реальном железе: подтверждение заменено confirm: yes.
# mirror_disk не задан — установщик возьмёт первый другой кандидат (/dev/vdb).
disk: /dev/vda
mirror: yes
# Малый профиль стенда: диски 13 ГиБ (MIRROR_DISK_GB, default) + root
# 3 ГиБ. Запрета нет: «зависания малого профиля» (issue #43) были строкой
# комментария без '#' в deploy.sh, а не ядром. Полный размер (≥50 ГиБ,
# продакшн-геометрия) — через MIRROR_DISK_GB=50+ для полевой приёмки.
system_size_mib: 3072
hostname: vlanit-pbx-mirror
timezone: Europe/Moscow
kernel_args: "VLANIT_TEST=1 VLANIT_MIRROR=1 console=ttyS0,115200 console=tty0"

network:
  mode: dhcp

admin:
  user: vlanit
  password: "vlanit-test-pass-123"

ssh:
  enabled: true

mikopbx:
  name: VLANit-Test-Mirror
  web_admin_login: admin
  web_admin_password: "admin12345"

wireguard:
  enabled: true
  address: 10.66.66.1/24
  listen_port: 51820

confirm: yes
