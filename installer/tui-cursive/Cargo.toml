[package]
name = "vlanit-tui"
version = "0.1.0"
edition = "2021"
description = "VLANit PBX OS installer TUI fallback (Cursive)"
license = "MIT"

[dependencies]
cursive = { version = "0.21", default-features = false, features = ["crossterm-backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "vlanit-tui"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
