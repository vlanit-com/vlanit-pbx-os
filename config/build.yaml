# Основной конфиг сборки VLANit PBX OS
distro:
  name: VLANit PBX OS
  version: "1.4.2"
  codename: trixie
  arch: amd64

debian:
  suite: trixie
  mirror: http://deb.debian.org/debian
  components: main contrib non-free-firmware

mikopbx:
  # pin: image+digest; процедура bump — docs/specs/mikopbx-update.md (#12)
  image: mikopbx/mikopbx:2026.9.5-amd64
  digest: "sha256:6326b3502a77484c97a5c7df18f9e73b57275373100117a00de23824f0e87337"
  # приводится к виду localhost/vlanit/mikopbx:<tag> при импорте
  local_name: localhost/vlanit/mikopbx:2026.9.5-amd64
  tag: "2026.9.5-amd64"
  container_name: mikopbx

installer:
  version: "1.0.0"
  # минимальные предварительные требования (на основе офиц. док-ции MikoPBX)
  min_ram_mb: 2048
  warn_disk_gb: 64
  # размер root-LV в процентах от usable-диска (диск − ESP 1 ГиБ − запас
  # метаданных 128 МиБ); остаток — Data. Тот же ключ читают минимум диска,
  # lv_data_mib и create_storage (единый источник — config/build.yaml).
  system_size_pct: 25

provisioning:
  schema_version: 1

output:
  iso_name: VLANit-PBX-1.4.2-amd64.iso
  # Guard размера ISO (scripts/check-iso-size.sh, CI build-iso). Baseline —
  # v1.4.2 + doctor GUI/netsurf; mmdebstrap+kernel 6.12.117 ≈849 MiB.
  # fail если size > baseline×(1+margin/100).
  iso_baseline_mib: 849
  iso_size_margin_pct: 5
